<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ea8d6"/>
      <stop offset="55%" stop-color="#b48cd6"/>
      <stop offset="100%" stop-color="#e06caf"/>
    </linearGradient>
  </defs>

  <!-- Rounded chassis -->
  <rect x="4" y="4" width="56" height="56" rx="14"
        fill="#1c1c1e" stroke="url(#brand)" stroke-width="2.5"/>

  <!-- 0 dB reference line -->
  <line x1="9" y1="32" x2="55" y2="32"
        stroke="url(#brand)" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.35"/>

  <!-- DQ as EQ curves -->
  <g stroke="url(#brand)" stroke-width="4.5" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- D: vertical reference + wide-shelf bulge + cross-bar -->
    <path d="M 14 17 L 14 47"/>
    <path d="M 14 17 Q 24 16 29 22 Q 33 28 31 32 Q 33 36 29 42 Q 24 48 14 47"/>
    <path d="M 14 32 L 30 32"/>

    <!-- Q: bell ring matched to D's footprint -->
    <path d="M 35 32 Q 35 17 44 17 Q 54 17 54 32 Q 54 47 44 47 Q 35 47 35 32 Z"/>
    <!-- Q tail -->
    <path d="M 50 41 L 55 47"/>
  </g>

  <!-- EQ-band handles -->
  <circle cx="31" cy="32" r="2.6" fill="url(#brand)"/>
  <circle cx="44" cy="17" r="2.6" fill="url(#brand)"/>
</svg>
