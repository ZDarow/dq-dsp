name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dq-dsp-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test

  firmware-host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dq-dsp-firmware/tests
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: make test-host

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: dq-dsp-firmware
          command: "cd dq-dsp-firmware && idf.py build"
