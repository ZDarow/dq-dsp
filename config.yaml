name: Local Only Config (No Network, CPU Only)
version: 1.0.0
schema: v1

models:
  # 1. Основная модель: чат, редактирование, apply, агент
  # CPU-only: 4 физических ядра Xeon E3-1230 v2, ~1.5 ГБ свободно RAM, без GPU
  # num_ctx 4096 — компромисс между качеством long-context и RAM-расходом KV-кеши
  - name: Llama 3.2 3B Chat
    provider: ollama
    model: llama3.2:perf
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 4096
      maxTokens: 2048
      temperature: 0.1
      topP: 0.9
      topK: 40
      minP: 0.1
      numThreads: 4
      numGpu: 0
      useMmap: true
      keepAlive: 600

  # 2. Tab-autocomplete через ту же модель (qwen2.5-coder недоступен без сети)
  # Llama 3.2 3B медленнее специализированных моделей, но работает локально
  - name: Llama 3.2 3B Autocomplete
    provider: ollama
    model: llama3.2:perf
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 512
      onlyMyCode: true
      useCache: true
      useRecentlyEdited: true
    defaultCompletionOptions:
      contextLength: 2048
      maxTokens: 64
      temperature: 0.2
      numThreads: 4
      numGpu: 0
      keepAlive: 600

  # 3. Эмбеддинг для поиска по кодовой базе
  - name: Qwen3 Embedding
    provider: ollama
    model: qwen3-embedding:0.6b
    apiBase: http://localhost:11434
    roles:
      - embed
    embedOptions:
      maxChunkSize: 512
      maxBatchSize: 4

context:
  - provider: code
  - provider: file
  - provider: diff
  - provider: terminal

rules:
  - "Отвечай кратко и по делу"
  - "Язык ответов: русский"
  - "При работе с кодом используй только локальные файлы проекта"
  - "Контекст ограничен 4096 токенами — отвечай компактно"