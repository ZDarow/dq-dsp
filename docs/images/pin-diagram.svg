<svg viewBox="0 0 760 510" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- Static pin diagram for the DQ-DSP wiring (ESP32-S3 → 2× PCM5102A).
       Colours are hard-coded so this file renders identically on any
       theme on GitHub. -->
  <defs>
    <marker id="arr-i2s0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5ed68b"/></marker>
    <marker id="arr-i2s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e0c46c"/></marker>
    <marker id="arr-pwr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e06c6c"/></marker>
    <marker id="arr-gnd"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6e6e74"/></marker>
    <style>
      .lbl   { font: 600 11px ui-monospace, "SF Mono", monospace; fill: #f0f0f2; }
      .note  { font: italic 9.5px ui-monospace, monospace; fill: #9a9aa0; }
      .grp   { font: 700 10px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.05em; }
      .title { font: 700 14px ui-sans-serif, system-ui, sans-serif; }
      .sub   { font: 10px ui-sans-serif, system-ui, sans-serif; fill: #9a9aa0; }
      .legend{ font: 10px ui-sans-serif, system-ui, sans-serif; fill: #9a9aa0; }
    </style>
  </defs>

  <!-- Page backdrop so the diagram reads on GitHub's light AND dark themes -->
  <rect width="760" height="510" fill="#1c1c1e" rx="14"/>

  <!-- ESP32-S3 module -->
  <rect x="30" y="50" width="200" height="400" rx="12" fill="#242428" stroke="#2e2e32" stroke-width="1.5"/>
  <text x="130" y="78" text-anchor="middle" class="title" fill="#f0f0f2">ESP32-S3</text>
  <text x="130" y="94" text-anchor="middle" class="sub">USB-OTG · UAC + CDC</text>
  <text x="130" y="108" text-anchor="middle" class="sub">N16R8 (16 MB flash + 8 MB PSRAM)</text>

  <!-- Power pins -->
  <circle cx="230" cy="140" r="4" fill="#e06c6c"/>
  <text x="220" y="144" text-anchor="end" class="lbl">3V3</text>
  <circle cx="230" cy="162" r="4" fill="#6e6e74"/>
  <text x="220" y="166" text-anchor="end" class="lbl">GND</text>

  <!-- I2S0 group -->
  <text x="40" y="210" class="grp" fill="#5ed68b">I2S0 → DAC #1</text>
  <circle cx="230" cy="226" r="4" fill="#5ed68b"/>
  <text x="220" y="230" text-anchor="end" class="lbl">GPIO 4 · BCK</text>
  <circle cx="230" cy="248" r="4" fill="#5ed68b"/>
  <text x="220" y="252" text-anchor="end" class="lbl">GPIO 5 · LCK</text>
  <circle cx="230" cy="270" r="4" fill="#5ed68b"/>
  <text x="220" y="274" text-anchor="end" class="lbl">GPIO 6 · DIN</text>

  <!-- I2S1 group -->
  <text x="40" y="320" class="grp" fill="#e0c46c">I2S1 → DAC #2</text>
  <circle cx="230" cy="336" r="4" fill="#e0c46c"/>
  <text x="220" y="340" text-anchor="end" class="lbl">GPIO 16 · BCK</text>
  <circle cx="230" cy="358" r="4" fill="#e0c46c"/>
  <text x="220" y="362" text-anchor="end" class="lbl">GPIO 17 · LCK</text>
  <circle cx="230" cy="380" r="4" fill="#e0c46c"/>
  <text x="220" y="384" text-anchor="end" class="lbl">GPIO 18 · DIN</text>

  <!-- USB-C indicator -->
  <rect x="60" y="10" width="60" height="22" rx="3" fill="#2e2e32" stroke="#9a9aa0"/>
  <text x="90" y="25" text-anchor="middle" class="lbl" fill="#9a9aa0">USB-C</text>
  <line x1="90" y1="32" x2="90" y2="50" stroke="#9a9aa0" stroke-dasharray="2,2"/>

  <!-- DAC #1 -->
  <rect x="500" y="50" width="240" height="180" rx="10" fill="#242428" stroke="#5ed68b" stroke-width="1.5"/>
  <text x="620" y="76" text-anchor="middle" class="title" fill="#5ed68b">PCM5102A #1</text>
  <text x="620" y="92" text-anchor="middle" class="sub">Left speaker · Out 1+2</text>
  <text x="620" y="106" text-anchor="middle" class="note">GY-PCM5102 · TENSTAR ROBOT</text>

  <circle cx="510" cy="120" r="4" fill="#6e6e74"/><text x="520" y="124" class="lbl">SCK</text><text x="560" y="124" class="note">→ GND (internal MCLK)</text>
  <circle cx="510" cy="142" r="4" fill="#5ed68b"/><text x="520" y="146" class="lbl">BCK</text>
  <circle cx="510" cy="164" r="4" fill="#5ed68b"/><text x="520" y="168" class="lbl">DIN</text>
  <circle cx="510" cy="186" r="4" fill="#5ed68b"/><text x="520" y="190" class="lbl">LCK</text>
  <circle cx="510" cy="208" r="4" fill="#6e6e74"/><text x="520" y="212" class="lbl">GND</text>
  <circle cx="510" cy="230" r="4" fill="#e06c6c"/><text x="520" y="234" class="lbl">VIN</text><text x="560" y="234" class="note">3.3 V</text>

  <text x="620" y="248" text-anchor="middle" class="note">back-side jumpers: H3L XSMT → HIGH (un-mute)</text>

  <!-- DAC #2 -->
  <rect x="500" y="270" width="240" height="180" rx="10" fill="#242428" stroke="#e0c46c" stroke-width="1.5"/>
  <text x="620" y="296" text-anchor="middle" class="title" fill="#e0c46c">PCM5102A #2</text>
  <text x="620" y="312" text-anchor="middle" class="sub">Right speaker · Out 3+4</text>
  <text x="620" y="326" text-anchor="middle" class="note">GY-PCM5102 · TENSTAR ROBOT</text>

  <circle cx="510" cy="340" r="4" fill="#6e6e74"/><text x="520" y="344" class="lbl">SCK</text><text x="560" y="344" class="note">→ GND (internal MCLK)</text>
  <circle cx="510" cy="362" r="4" fill="#e0c46c"/><text x="520" y="366" class="lbl">BCK</text>
  <circle cx="510" cy="384" r="4" fill="#e0c46c"/><text x="520" y="388" class="lbl">DIN</text>
  <circle cx="510" cy="406" r="4" fill="#e0c46c"/><text x="520" y="410" class="lbl">LCK</text>
  <circle cx="510" cy="428" r="4" fill="#6e6e74"/><text x="520" y="432" class="lbl">GND</text>
  <circle cx="510" cy="450" r="4" fill="#e06c6c"/><text x="520" y="454" class="lbl">VIN</text><text x="560" y="454" class="note">3.3 V</text>

  <text x="620" y="468" text-anchor="middle" class="note">back-side jumpers: H3L XSMT → HIGH (un-mute)</text>

  <!-- Power rails -->
  <path d="M 230 140 L 360 140 L 360 230 L 510 230" fill="none" stroke="#e06c6c" stroke-width="2" marker-end="url(#arr-pwr)"/>
  <path d="M 360 230 L 360 450 L 510 450" fill="none" stroke="#e06c6c" stroke-width="2" marker-end="url(#arr-pwr)"/>

  <!-- GND rails (incl. SCK ties) -->
  <path d="M 230 162 L 380 162 L 380 208 L 510 208" fill="none" stroke="#6e6e74" stroke-width="2" marker-end="url(#arr-gnd)"/>
  <path d="M 380 162 L 380 120 L 510 120" fill="none" stroke="#6e6e74" stroke-width="1.6" marker-end="url(#arr-gnd)" opacity="0.85"/>
  <path d="M 380 208 L 380 428 L 510 428" fill="none" stroke="#6e6e74" stroke-width="2" marker-end="url(#arr-gnd)"/>
  <path d="M 380 428 L 380 340 L 510 340" fill="none" stroke="#6e6e74" stroke-width="1.6" marker-end="url(#arr-gnd)" opacity="0.85"/>

  <!-- I2S0 trio → DAC #1 -->
  <path d="M 230 226 C 340 226, 420 142, 510 142" fill="none" stroke="#5ed68b" stroke-width="2" marker-end="url(#arr-i2s0)"/>
  <path d="M 230 248 C 340 248, 420 186, 510 186" fill="none" stroke="#5ed68b" stroke-width="2" marker-end="url(#arr-i2s0)"/>
  <path d="M 230 270 C 340 270, 420 164, 510 164" fill="none" stroke="#5ed68b" stroke-width="2" marker-end="url(#arr-i2s0)"/>

  <!-- I2S1 trio → DAC #2 -->
  <path d="M 230 336 C 340 336, 420 362, 510 362" fill="none" stroke="#e0c46c" stroke-width="2" marker-end="url(#arr-i2s1)"/>
  <path d="M 230 358 C 340 358, 420 406, 510 406" fill="none" stroke="#e0c46c" stroke-width="2" marker-end="url(#arr-i2s1)"/>
  <path d="M 230 380 C 340 380, 420 384, 510 384" fill="none" stroke="#e0c46c" stroke-width="2" marker-end="url(#arr-i2s1)"/>

  <!-- Legend -->
  <g transform="translate(40 488)">
    <circle cx="0" cy="0" r="4" fill="#5ed68b"/><text x="10" y="4" class="legend">I2S0 → DAC #1</text>
    <circle cx="120" cy="0" r="4" fill="#e0c46c"/><text x="130" y="4" class="legend">I2S1 → DAC #2</text>
    <circle cx="240" cy="0" r="4" fill="#e06c6c"/><text x="250" y="4" class="legend">3V3 power</text>
    <circle cx="340" cy="0" r="4" fill="#6e6e74"/><text x="350" y="4" class="legend">GND (incl. SCK tie)</text>
  </g>
</svg>
