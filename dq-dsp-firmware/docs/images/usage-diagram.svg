<svg viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- High-level "how do I use this" topology — Mac → DQ-DSP → 2 amps → 2-way speaker pair -->
  <defs>
    <marker id="ar-aud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5ea8d6"/></marker>
    <marker id="ar-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b48cd6"/></marker>
    <marker id="ar-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5ed68b"/></marker>
    <marker id="ar-out2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e0c46c"/></marker>
    <style>
      .box-bg { fill: #242428; stroke: #2e2e32; stroke-width: 1.5; }
      .title { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #f0f0f2; }
      .sub   { font: 10px ui-sans-serif, system-ui, sans-serif; fill: #9a9aa0; }
      .badge { font: 600 10px ui-monospace, monospace; }
      .lbl   { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #f0f0f2; }
      .small { font: italic 9.5px ui-sans-serif, monospace; fill: #6e6e74; }
    </style>
  </defs>

  <rect width="920" height="420" fill="#1c1c1e" rx="14"/>

  <!-- Source: Computer -->
  <rect x="20" y="60" width="180" height="200" rx="10" class="box-bg"/>
  <text x="110" y="86" text-anchor="middle" class="title">Mac / PC / phone</text>
  <text x="110" y="102" text-anchor="middle" class="sub">USB host + Chrome browser</text>
  <rect x="40" y="120" width="140" height="44" rx="6" fill="#1c1c1e" stroke="#5ea8d6"/>
  <text x="110" y="140" text-anchor="middle" class="lbl" fill="#5ea8d6">🎵 Audio app</text>
  <text x="110" y="156" text-anchor="middle" class="small">Spotify · Apple Music · etc.</text>
  <rect x="40" y="180" width="140" height="44" rx="6" fill="#1c1c1e" stroke="#b48cd6"/>
  <text x="110" y="200" text-anchor="middle" class="lbl" fill="#b48cd6">🌐 Chrome → UI</text>
  <text x="110" y="216" text-anchor="middle" class="small">dq-dsp.tamduongs.com</text>

  <!-- Cable labels (entering DQ-DSP) -->
  <text x="265" y="135" class="badge" fill="#5ea8d6">USB-C #1 · UAC audio</text>
  <text x="265" y="200" class="badge" fill="#b48cd6">USB-C #2 · Web Serial</text>

  <!-- DQ-DSP box -->
  <rect x="380" y="60" width="200" height="240" rx="12" class="box-bg" stroke-width="2" stroke="url(#brand-grad)"/>
  <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5ea8d6"/>
    <stop offset="55%" stop-color="#b48cd6"/>
    <stop offset="100%" stop-color="#e06caf"/>
  </linearGradient>
  <text x="480" y="84" text-anchor="middle" class="title">DQ-DSP</text>
  <text x="480" y="100" text-anchor="middle" class="sub">ESP32-S3 + 2× PCM5102A</text>
  <text x="480" y="114" text-anchor="middle" class="small">≈ $20 BOM</text>

  <!-- Pipeline blocks inside -->
  <rect x="400" y="130" width="160" height="20" rx="4" fill="#2e2e32"/>
  <text x="480" y="144" text-anchor="middle" class="lbl">USB-IN → ASRC → DSP</text>
  <rect x="400" y="156" width="160" height="20" rx="4" fill="#2e2e32"/>
  <text x="480" y="170" text-anchor="middle" class="lbl">PEQ · XO · Delay · Gain</text>
  <rect x="400" y="182" width="160" height="20" rx="4" fill="#2e2e32"/>
  <text x="480" y="196" text-anchor="middle" class="lbl">2× I2S → 4 line outs</text>

  <!-- 4 output sockets -->
  <circle cx="580" cy="220" r="5" fill="#5ed68b"/><text x="565" y="224" text-anchor="end" class="lbl">Out 1</text>
  <circle cx="580" cy="240" r="5" fill="#e0c46c"/><text x="565" y="244" text-anchor="end" class="lbl">Out 2</text>
  <circle cx="580" cy="260" r="5" fill="#b48cd6"/><text x="565" y="264" text-anchor="end" class="lbl">Out 3</text>
  <circle cx="580" cy="280" r="5" fill="#e06caf"/><text x="565" y="284" text-anchor="end" class="lbl">Out 4</text>

  <!-- Wires from source to DQ-DSP -->
  <path d="M 200 142 C 290 142, 290 142, 380 142" fill="none" stroke="#5ea8d6" stroke-width="2.5" marker-end="url(#ar-aud)"/>
  <path d="M 200 202 C 290 202, 290 202, 380 168" fill="none" stroke="#b48cd6" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar-ctl)"/>

  <!-- Power amp + speaker LEFT -->
  <rect x="660" y="80" width="100" height="50" rx="6" class="box-bg"/>
  <text x="710" y="100" text-anchor="middle" class="title" font-size="11">Class-D amp</text>
  <text x="710" y="114" text-anchor="middle" class="small">left channel</text>
  <rect x="800" y="60" width="90" height="90" rx="6" class="box-bg" stroke="#5ed68b" stroke-width="1.5"/>
  <text x="845" y="82" text-anchor="middle" class="title" font-size="11" fill="#5ed68b">Speaker L</text>
  <circle cx="845" cy="105" r="9" fill="none" stroke="#e0c46c" stroke-width="1.5"/>
  <text x="845" y="108" text-anchor="middle" class="small" fill="#e0c46c">tweeter</text>
  <circle cx="845" cy="135" r="14" fill="none" stroke="#5ed68b" stroke-width="1.5"/>
  <text x="845" y="139" text-anchor="middle" class="small" fill="#5ed68b">woofer</text>

  <!-- Power amp + speaker RIGHT -->
  <rect x="660" y="290" width="100" height="50" rx="6" class="box-bg"/>
  <text x="710" y="310" text-anchor="middle" class="title" font-size="11">Class-D amp</text>
  <text x="710" y="324" text-anchor="middle" class="small">right channel</text>
  <rect x="800" y="270" width="90" height="90" rx="6" class="box-bg" stroke="#e06caf" stroke-width="1.5"/>
  <text x="845" y="292" text-anchor="middle" class="title" font-size="11" fill="#e06caf">Speaker R</text>
  <circle cx="845" cy="315" r="9" fill="none" stroke="#b48cd6" stroke-width="1.5"/>
  <text x="845" y="318" text-anchor="middle" class="small" fill="#b48cd6">tweeter</text>
  <circle cx="845" cy="345" r="14" fill="none" stroke="#e06caf" stroke-width="1.5"/>
  <text x="845" y="349" text-anchor="middle" class="small" fill="#e06caf">woofer</text>

  <!-- Wires Out 1 (woofer L) + Out 2 (tweeter L) → amp L → speaker L -->
  <path d="M 580 220 C 620 220, 620 105, 660 105" fill="none" stroke="#5ed68b" stroke-width="2" marker-end="url(#ar-out)"/>
  <path d="M 580 240 C 625 240, 625 105, 660 105" fill="none" stroke="#e0c46c" stroke-width="2" marker-end="url(#ar-out2)"/>
  <path d="M 760 105 L 800 105" fill="none" stroke="#e0c46c" stroke-width="2"/>
  <path d="M 760 115 L 800 135" fill="none" stroke="#5ed68b" stroke-width="2"/>

  <!-- Wires Out 3/4 → amp R → speaker R -->
  <path d="M 580 260 C 625 260, 625 315, 660 315" fill="none" stroke="#b48cd6" stroke-width="2" marker-end="url(#ar-ctl)"/>
  <path d="M 580 280 C 620 280, 620 315, 660 315" fill="none" stroke="#e06caf" stroke-width="2" marker-end="url(#ar-out)"/>
  <path d="M 760 315 L 800 315" fill="none" stroke="#b48cd6" stroke-width="2"/>
  <path d="M 760 325 L 800 345" fill="none" stroke="#e06caf" stroke-width="2"/>

  <!-- Caption -->
  <text x="460" y="380" text-anchor="middle" class="sub">
    <tspan fill="#5ea8d6">━━</tspan> audio over USB UAC   ·
    <tspan fill="#b48cd6">- - -</tspan> control over Web Serial (UART0/USB-CDC)   ·
    <tspan fill="#5ed68b">━</tspan>/<tspan fill="#e0c46c">━</tspan>/<tspan fill="#b48cd6">━</tspan>/<tspan fill="#e06caf">━</tspan> 4 line outs
  </text>
  <text x="460" y="398" text-anchor="middle" class="small">
    Active 2-way bi-amp: Out 1 = woofer L (LP), Out 2 = tweeter L (HP), Out 3 = tweeter R, Out 4 = woofer R
  </text>
</svg>
